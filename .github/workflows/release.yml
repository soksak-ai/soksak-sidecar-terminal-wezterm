# 릴리즈 — main 에서 수동 dispatch 시 다섯 플랫폼 타깃마다 사이드카 dist 아카이브를 빌드해
# owner-immutable GitHub Release 자산으로 올린다. 각 타깃은 그 타깃의 네이티브 러너에서
# 빌드하므로 크로스 링커가 필요 없다. 버전/태그는 소유 manifest(Cargo.toml)에서 유도하고
# sidecar.json 과의 일치를 build-release 가 판정한다.
# publish 는 매트릭스 전체를 내려받아 소유 릴리즈 manifest(release.json)와 conformance 리포트
# 3종을 합성하고, 핀된 공개 soksak-spec 검증기로 판정한 뒤에만 자산으로 올린다 — 서명 레지스트리
# 인덱스가 릴리즈를 실을 수 있는 것은 이 manifest 뿐이다.
# 소비측(플러그인 manifest sidecars[].reach.fetch.url[platform] + sha256[platform])이 자산을 집는다.
name: release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-wezterm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-sidecars/soksak-sidecar-terminal-wezterm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soksak-ai/soksak-kit-sidecar-terminal
          ref: 4af58a772a141b9e4d4258ae5f21a140aa162d82
          path: soksak-kits/soksak-kit-sidecar-terminal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soksak-ai/soksak-contract-terminal
          ref: cab0691a1a01fca7436ac29f6cc2850245788ea6
          path: soksak-contracts/soksak-contract-terminal
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - id: identity
        shell: bash
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$ver" in ''|*[!0-9.]*) echo "invalid version: $ver" >&2; exit 1;; esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Build and stage the release binary for this target
        shell: bash
        run: ./stage.sh dist "${{ matrix.target }}"
      - id: archive
        shell: bash
        run: |
          ver="${{ steps.identity.outputs.version }}"
          out="soksak-sidecar-terminal-wezterm-$ver-${{ matrix.target }}.tar.gz"
          mkdir -p package/dist
          cp dist/sidecar.json package/sidecar.json
          cp LICENSE THIRD-PARTY-NOTICES package/
          cp dist/soksak-sidecar-terminal-wezterm* package/dist/
          tar -czf "$out" -C package .
          # sha256 도구는 러너마다 다르다 — macOS 는 shasum(perl), linux·windows(git-bash)
          # 는 sha256sum(coreutils). 둘 다 "<hex>  <file>" 형식으로 동일하다.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" | tee "$out.sha256"
          else
            shasum -a 256 "$out" | tee "$out.sha256"
          fi
          echo "asset=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-${{ matrix.target }}
          path: |
            soksak-sidecars/soksak-sidecar-terminal-wezterm/${{ steps.archive.outputs.asset }}
            soksak-sidecars/soksak-sidecar-terminal-wezterm/${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soksak-sidecars/soksak-sidecar-terminal-wezterm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: soksak-sidecars/soksak-sidecar-terminal-wezterm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: "10.30.3"
      - id: identity
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          case "$ver" in ''|*[!0-9.]*) echo "invalid version: $ver" >&2; exit 1;; esac
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: soksak-sidecars/soksak-sidecar-terminal-wezterm/dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: soksak-ai/soksak-spec
          ref: 50993e5287a29e0d0a2f0cac096fa5ef12d06ea4
          path: soksak-sidecars/soksak-sidecar-terminal-wezterm/.dependency/soksak-spec
      - name: Build the exact public validator without links
        working-directory: soksak-sidecars/soksak-sidecar-terminal-wezterm/.dependency/soksak-spec
        run: |
          pnpm --config.node-linker=hoisted --config.symlink=false install --frozen-lockfile
          pnpm build
          test -z "$(find . -type l -print -quit)"
      - run: node .dependency/soksak-spec/packages/plugin-spec/release-template/sidecar/build-release.mjs --commit "${{ github.sha }}" --tag "${{ steps.identity.outputs.tag }}" --artifacts dist --out dist-release
      - run: node .dependency/soksak-spec/packages/plugin-spec/release-template/sidecar/validate-with-spec.mjs --spec-root .dependency/soksak-spec --release-dir dist-release
      - name: Create least-privilege release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Collect the canonical public asset set
        run: |
          mkdir publish-assets
          find dist -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} publish-assets/ \;
          cp dist-release/*.json publish-assets/
      - name: Publish through owner-enforced immutable releases
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          test "$(gh api "repos/${{ github.repository }}/immutable-releases" --jq '.enabled and .enforced_by_owner')" = "true" || { echo "owner-enforced immutable releases must be enabled before tagging" >&2; exit 1; }
          node .dependency/soksak-spec/packages/plugin-spec/release-template/publish-canonical-release.mjs --repository "${{ github.repository }}" --commit "${{ github.sha }}" --artifacts "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-wezterm/publish-assets" --manifest "$GITHUB_WORKSPACE/soksak-sidecars/soksak-sidecar-terminal-wezterm/publish-assets/release.json"
